name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # PostgreSQL for the integration tests. They create (and drop) their own throwaway database
    # on this server, so nothing else needs to be provisioned.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only values (not secrets): the test database server and throwaway keys.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bank_ci?schema=public
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret-0123456789
      ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests (unit + integration against PostgreSQL)
        run: npm test

      - name: Production build
        run: npm run build

      # Fails the build on critical advisories in production dependencies.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical
